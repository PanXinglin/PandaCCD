name: panda_ccd
description: PandaCCD · 把今天拍成旧时光
publish_to: none
version: 0.14.9+48
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  gal: ^2.3.3
  sensors_plus: ^7.1.1
  audioplayers: ^6.8.1
  vol_spotter: ^0.2.1
  photo_manager: ^3.12.0
  crypto: ^3.0.8
  video_player: ^2.14.1
  panda_media:
    path: packages/panda_media
  image_picker: ^1.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  camera_android_camerax: ^0.7.6
flutter:
  uses-material-design: true
  assets:
    - assets/brand/panda-mark.png
    - assets/luts/
    - assets/audio/
    - assets/licenses/
  shaders:
    - shaders/ccd.frag

# Upstream 0.7.6, two Dart-only preview fixes; see third_party patch notes.
dependency_overrides:
  camera:
    path: third_party/camera
  camera_android_camerax:
    path: third_party/camera_android_camerax
  camera_avfoundation:
    path: third_party/camera_avfoundation
  vol_spotter_ios:
    path: third_party/vol_spotter_ios
